[package]
name = "rrr"
description = "Implementation of the Recursive Record Registry data format"
version = "0.1.0"
edition = "2024"

[lib]
name = "rrr"
path = "src/lib.rs"

[[bin]]
name = "rrr"
path = "src/bin.rs"
required-features = ["cmd"]

[features]
cmd = [
    "dep:cbor-diag",
    "dep:clap",
    "dep:color-eyre",
    "dep:hex",
    "dep:tracing-error",
    "dep:tracing-subscriber",
]

[dependencies]
aes-gcm = "0.11.1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
async-fd-lock = "0.2.0"
async-scoped = { version = "0.9.0", features = ["use-tokio"] }
async-trait = "0.1.92"
casey = "0.4.2"
chrono = "0.4.45"
ciborium-io = { version = "0.2.2", features = ["std"] }
coset = { version = "0.4.2", features = ["std"] }
derive_more = { version = "2.1", features = ["full"] }
ed25519-dalek = { version = "3.0", features = ["rand_core", "pem"] }
futures = "0.3.34"
hex-buffer-serde = { version = "0.4.0", features = ["const_len"] }
hkdf = "0.13.0"
indexmap = "2.14"
itertools = "0.15.0"
proptest = "1.12"
proptest-derive = "0.9.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24"
sha2 = "0.11.1"
test-strategy = "0.4.5"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io-util"] }
tracing = "0.1.44"
zeroize = { version = "1.9", features = ["zeroize_derive"] }

# Conditionally enabled dependencies
cbor-diag = { version = "0.1.12", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
color-eyre = { version = "0.6.5", optional = true }
hex = { version = "0.4.3", optional = true }
tracing-error = { version = "0.2.1", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

[dev-dependencies]
# Workaround for map validation bugs in `cddl` 0.10.7 (the latest release; earlier 0.10.x untested),
# which make the tests in `tests/cddl.rs` fail on valid data. The validator rejects map entries
# whose key is a type choice, such as `* label => values` in `COSE_Key`
# (https://github.com/anweiss/cddl/issues/837, fixed on `main` but unreleased), and entries whose
# key is a rule name bound to an integer, such as `RRR_SegmentMetadataRegistered_file_tag ^=> bstr`
# (no upstream issue found). Once a release fixes both, upgrade to it; `tests/cddl.rs` needs no
# changes.
cddl = "0.9.5"
criterion = { version = "0.8.2", features = ["async_tokio"] }
criterion-macro = "0.4.0"
tempfile = "3.27"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }

[[bench]]
name = "benches"
